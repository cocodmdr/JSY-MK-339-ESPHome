# Package for JSY-MK-339 Energy Meter
# Core V1.1 profile: diagnostics + main electrical measurements

substitutions:
  skip_updates_20s: "3"
  skip_updates_60s: "11"
  metadata_internal: "false"
  diagnostics_internal: "false"
  alarms_internal: "false"
  config_internal: "false"
  limits_internal: "false"

modbus_controller:
  - id: ${meter_id}_main
    address: ${meter_address}
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 5s
    command_throttle: 100ms
    max_cmd_retries: 2
    offline_skip_updates: 3

sensor:
  - platform: modbus_controller
    modbus_controller_id: ${meter_id}_main
    name: "${meter_name} Model Raw"
    id: ${meter_id}_model_raw
    register_type: holding
    address: 0x0000
    force_new_range: true
    value_type: U_WORD
    internal: true
    skip_updates: ${skip_updates_60s}
    entity_category: diagnostic
    icon: mdi:chip

  - platform: modbus_controller
    modbus_controller_id: ${meter_id}_main
    name: "${meter_name} Hardware Version Raw"
    id: ${meter_id}_hw_ver_raw
    register_type: holding
    address: 0x0001
    value_type: U_WORD
    internal: true
    skip_updates: ${skip_updates_60s}
    entity_category: diagnostic
    icon: mdi:information-outline

  - platform: modbus_controller
    modbus_controller_id: ${meter_id}_main
    name: "${meter_name} Software Version Raw"
    id: ${meter_id}_sw_ver_raw
    register_type: holding
    address: 0x0002
    value_type: U_WORD
    internal: true
    skip_updates: ${skip_updates_60s}
    entity_category: diagnostic
    icon: mdi:information-outline

  - platform: modbus_controller
    modbus_controller_id: ${meter_id}_main
    name: "${meter_name} Protocol Version Raw"
    id: ${meter_id}_proto_ver_raw
    register_type: holding
    address: 0x0003
    value_type: U_WORD
    internal: true
    skip_updates: ${skip_updates_60s}
    entity_category: diagnostic
    icon: mdi:information-outline

  - platform: modbus_controller
    modbus_controller_id: ${meter_id}_main
    name: "${meter_name} Comm RS485 Config Raw"
    id: ${meter_id}_rs485_cfg_raw
    register_type: holding
    address: 0x0004
    value_type: U_WORD
    internal: true
    skip_updates: ${skip_updates_60s}
    entity_category: diagnostic
    icon: mdi:serial-port

  - platform: modbus_controller
    modbus_controller_id: ${meter_id}_main
    name: "${meter_name} Limit Voltage"
    id: ${meter_id}_voltage_limit
    register_type: holding
    address: 0x0020
    force_new_range: true
    value_type: U_WORD
    unit_of_measurement: V
    accuracy_decimals: 0
    internal: ${limits_internal}
    skip_updates: ${skip_updates_60s}
    entity_category: diagnostic
    icon: mdi:sine-wave

  - platform: modbus_controller
    modbus_controller_id: ${meter_id}_main
    name: "${meter_name} Limit Current"
    id: ${meter_id}_current_limit
    register_type: holding
    address: 0x0021
    value_type: U_WORD
    unit_of_measurement: A
    accuracy_decimals: 1
    internal: ${limits_internal}
    skip_updates: ${skip_updates_60s}
    entity_category: diagnostic
    icon: mdi:current-ac
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${meter_id}_main
    name: "${meter_name} Limit Leakage Current"
    id: ${meter_id}_leakage_limit
    register_type: holding
    address: 0x0026
    value_type: U_WORD
    unit_of_measurement: A
    accuracy_decimals: 3
    internal: ${limits_internal}
    skip_updates: ${skip_updates_60s}
    entity_category: diagnostic
    icon: mdi:current-ac
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: ${meter_id}_main
    name: "${meter_name} Config Wiring Mode Raw"
    id: ${meter_id}_wiring_mode_raw
    register_type: holding
    address: 0x0025
    value_type: U_WORD
    internal: true
    entity_category: diagnostic
    icon: mdi:transmission-tower
    skip_updates: ${skip_updates_60s}

  - platform: template
    name: "${meter_name} Comm RS485 Address"
    lambda: return (int32_t) ((((uint16_t) id(${meter_id}_rs485_cfg_raw).state) >> 8) & 0xFF);
    accuracy_decimals: 0
    internal: ${metadata_internal}
    entity_category: diagnostic
    icon: mdi:numeric

  - platform: template
    name: "${meter_name} Comm RS485 Baud Code"
    lambda: return ((uint16_t) id(${meter_id}_rs485_cfg_raw).state) & 0x0F;
    accuracy_decimals: 0
    internal: ${metadata_internal}
    entity_category: diagnostic
    icon: mdi:speedometer

  - platform: template
    name: "${meter_name} Comm RS485 Data Format Code"
    lambda: return ((((uint16_t) id(${meter_id}_rs485_cfg_raw).state) & 0x00FF) >> 4) & 0x03;
    accuracy_decimals: 0
    internal: ${metadata_internal}
    entity_category: diagnostic
    icon: mdi:format-list-bulleted

  - platform: template
    name: "${meter_name} Comm RS485 Baud bps"
    lambda: |-
      const uint8_t code = ((uint16_t) id(${meter_id}_rs485_cfg_raw).state) & 0x0F;
      switch (code) {
        case 2: return 600;
        case 3: return 1200;
        case 4: return 2400;
        case 5: return 4800;
        case 6: return 9600;
        case 7: return 19200;
        case 8: return 38400;
        default: return 0;
      }
    accuracy_decimals: 0
    unit_of_measurement: bps
    internal: ${metadata_internal}
    entity_category: diagnostic
    icon: mdi:swap-horizontal

