text_sensor:
  - platform: template
    name: "${meter_name} Version Model"
    lambda: |-
      if (isnan(id(${meter_id}_model_raw).state)) return std::string("unknown");
      const uint16_t raw = (uint16_t) id(${meter_id}_model_raw).state;
      if (raw == 0x0339) return std::string("JSY-MK-339");
      char out[24];
      snprintf(out, sizeof(out), "unknown (0x%04X)", raw);
      return std::string(out);
    icon: mdi:chip
    internal: ${metadata_internal}
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "${meter_name} Version Hardware"
    lambda: |-
      if (isnan(id(${meter_id}_hw_ver_raw).state)) return std::string("unknown");
      const uint16_t raw = (uint16_t) id(${meter_id}_hw_ver_raw).state;
      const uint8_t major = (raw >> 12) & 0x0F;
      const uint8_t minor = (raw >> 4) & 0xFF;
      const uint8_t patch = raw & 0x0F;
      char out[20];
      snprintf(out, sizeof(out), "V%u.%02u.%u", major, minor, patch);
      return std::string(out);
    icon: mdi:information-outline
    internal: ${metadata_internal}
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "${meter_name} Version Software"
    lambda: |-
      if (isnan(id(${meter_id}_sw_ver_raw).state)) return std::string("unknown");
      const uint16_t raw = (uint16_t) id(${meter_id}_sw_ver_raw).state;
      const uint8_t major = (raw >> 12) & 0x0F;
      const uint8_t minor = (raw >> 4) & 0xFF;
      const uint8_t patch = raw & 0x0F;
      char out[20];
      snprintf(out, sizeof(out), "V%u.%02u.%u", major, minor, patch);
      return std::string(out);
    icon: mdi:information-outline
    internal: ${metadata_internal}
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "${meter_name} Version Protocol"
    lambda: |-
      if (isnan(id(${meter_id}_proto_ver_raw).state)) return std::string("unknown");
      const uint16_t raw = (uint16_t) id(${meter_id}_proto_ver_raw).state;
      const uint8_t major = (raw >> 12) & 0x0F;
      const uint8_t minor = (raw >> 4) & 0xFF;
      const uint8_t patch = raw & 0x0F;
      char out[20];
      snprintf(out, sizeof(out), "V%u.%02u.%u", major, minor, patch);
      return std::string(out);
    icon: mdi:information-outline
    internal: ${metadata_internal}
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "${meter_name} Comm RS485 Data Format"
    lambda: |-
      if (isnan(id(${meter_id}_rs485_cfg_raw).state)) return std::string("unknown");
      const uint8_t fmt = ((((uint16_t) id(${meter_id}_rs485_cfg_raw).state) & 0x00FF) >> 4) & 0x03;
      switch (fmt) {
        case 0: return std::string("8,N,1");
        case 1: return std::string("8,E,1");
        case 2: return std::string("8,O,1");
        case 3: return std::string("8,N,2");
        default: return std::string("unknown");
      }
    icon: mdi:format-list-bulleted
    internal: ${metadata_internal}
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "${meter_name} Direction Active Power"
    lambda: |-
      if (isnan(id(${meter_id}_power_direction_raw).state)) return std::string("unknown");
      const uint16_t raw = (uint16_t) id(${meter_id}_power_direction_raw).state;
      if (raw & 0x0008) return std::string("reverse");
      return std::string("forward");
    icon: mdi:arrow-left-right
    internal: ${diagnostics_internal}
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "${meter_name} Direction Reactive Power"
    lambda: |-
      if (isnan(id(${meter_id}_power_direction_raw).state)) return std::string("unknown");
      const uint16_t raw = (uint16_t) id(${meter_id}_power_direction_raw).state;
      if (raw & 0x0080) return std::string("reverse");
      return std::string("forward");
    icon: mdi:arrow-left-right
    internal: ${diagnostics_internal}
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "${meter_name} Config Wiring Mode"
    lambda: |-
      if (isnan(id(${meter_id}_wiring_mode_raw).state)) return std::string("unknown");
      const uint16_t mode = (uint16_t) id(${meter_id}_wiring_mode_raw).state;
      if (mode == 0x0001) return std::string("3-phase 3-wire");
      return std::string("3-phase 4-wire");
    icon: mdi:transmission-tower
    internal: ${config_internal}
    entity_category: config
    update_interval: 60s

